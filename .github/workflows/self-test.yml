# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The emulator's own CI: this commit of KickEmulator, through the same reusable workflow forks
# call (test-firmware.yml), against KickEm-Tools/0700-AAM main. Fast mode on macOS and faithful
# mode on a hosted arm64 Linux runner (TCG: no KVM there), smoke in both.
name: self-test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly, so drift in the firmware's main shows up without a push here
  workflow_dispatch:
    inputs:
      firmware-ref:
        description: "KickEm-Tools/0700-AAM ref"
        default: main
      checks:
        description: "checks for fast mode"
        default: smoke
      fast-runner:
        description: "runner for fast mode"
        default: macos-14

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    uses: ./.github/workflows/test-firmware.yml
    with:
      firmware-repository: KickEm-Tools/0700-AAM
      firmware-ref: ${{ inputs.firmware-ref || 'main' }}
      mode: fast
      runner: ${{ inputs.fast-runner || 'macos-14' }}
      checks: ${{ inputs.checks || 'smoke' }}
      emulator-repository: ${{ github.repository }}
      emulator-ref: ${{ github.sha }}

  vm:
    uses: ./.github/workflows/test-firmware.yml
    with:
      firmware-repository: KickEm-Tools/0700-AAM
      firmware-ref: ${{ inputs.firmware-ref || 'main' }}
      mode: vm
      checks: smoke
      emulator-repository: ${{ github.repository }}
      emulator-ref: ${{ github.sha }}

